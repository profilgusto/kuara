# Traefik — Edge Reverse Proxy for Kuara Platform
#
# Run this ONCE on the host (separate from the app compose):
#   docker compose -f docker-compose.traefik.yml up -d
#
# This creates the shared `traefik-net` network that the app compose joins.
# Traefik watches Docker labels for routing configuration.
#
# TLS options:
#   A) Let's Encrypt (default below) — Traefik handles certificates automatically.
#   B) Cloudflare Tunnel — disable ports 80/443, use cloudflared instead.
#      In that case, set TRAEFIK_ENTRYPOINT_HTTPS to point to the tunnel.
#
# Environment variables (set in .env.traefik or on the host):
#   TRAEFIK_ACME_EMAIL  — your email for Let's Encrypt notifications
#   TRAEFIK_DOMAIN      — primary domain (e.g. kuara.example.com)

services:

  traefik:
    image: traefik:v3.3
    restart: always
    command:
      # ── API / Dashboard (internal only) ─────────────────────────────────────
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # ── Docker provider ──────────────────────────────────────────────────────
      - "--providers.docker=true"
      - "--providers.docker.network=traefik-net"
      - "--providers.docker.exposedbydefault=false"

      # ── Entrypoints ──────────────────────────────────────────────────────────
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect HTTP → HTTPS globally
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

      # ── Let's Encrypt (ACME) ─────────────────────────────────────────────────
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"

      # ── Logging ──────────────────────────────────────────────────────────────
      - "--log.level=WARN"
      - "--accesslog=true"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Docker socket — allows Traefik to watch container labels
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persist TLS certificates across restarts
      - traefik-letsencrypt:/letsencrypt

    networks:
      - traefik-net

    deploy:
      resources:
        limits:
          memory: 128m

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ── Shared external network ───────────────────────────────────────────────────
# The app compose declares this as external and joins it.
networks:
  traefik-net:
    name: traefik-net
    driver: bridge

volumes:
  traefik-letsencrypt:
    driver: local
