# Nginx — Kuara Production Reverse Proxy
# Receives traffic from cloudflared tunnel (localhost only).
# TLS is terminated at Cloudflare; this speaks plain HTTP internally.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$http_cf_connecting_ip - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;   # Hide Nginx version

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml
        font/woff
        font/woff2;

    # ── Upstream: Next.js / Payload ───────────────────────────────────────────
    upstream kuara_app {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;   # Accepts any hostname (cloudflared controls routing)

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Content-Type-Options  "nosniff"         always;
        add_header X-Frame-Options         "SAMEORIGIN"      always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # Restore the real visitor IP forwarded by Cloudflare
        real_ip_header CF-Connecting-IP;

        client_max_body_size 100m;   # Match Payload upload limits

        # ── Static assets — long-lived cache ─────────────────────────────────
        location /_next/static/ {
            proxy_pass http://kuara_app;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_set_header Host $host;
        }

        # ── Public media uploaded via Payload ─────────────────────────────────
        location /media/ {
            proxy_pass http://kuara_app;
            add_header Cache-Control "public, max-age=86400";   # 1 day
            proxy_set_header Host $host;
        }

        # ── WebSocket support (Payload admin live-queries) ────────────────────
        location /api/ {
            proxy_pass http://kuara_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;   # Always HTTPS at Cloudflare edge
            proxy_read_timeout 120s;
        }

        # ── Everything else → Next.js ─────────────────────────────────────────
        location / {
            proxy_pass http://kuara_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }
}
