services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API (accessible from host for local dev)
      - "9001:9001"   # MinIO console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kuara}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kuara_dev_secret}
    volumes:
      - kuara-minio-data:/data
    networks:
      - kuara-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - kuara-net
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 $${MINIO_ROOT_USER:-kuara} $${MINIO_ROOT_PASSWORD:-kuara_dev_secret};
      mc mb --ignore-existing minio/kuara-media;
      mc anonymous set download minio/kuara-media;
      echo 'Bucket kuara-media ready.';
      "
    restart: "no"

  postgres:
    image: postgres:16-alpine
    volumes:
      - kuara-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: kuara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kuara
    networks:
      - kuara-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kuara" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://kuara:${POSTGRES_PASSWORD}@postgres:5432/kuara
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - NEXT_PUBLIC_SERVER_URL=http://localhost:3000
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=kuara-media
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-kuara}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-kuara_dev_secret}
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - kuara-net
    restart: unless-stopped
    volumes:
      # Mount source for hot-reload during development
      - ./app:/app
      - /app/node_modules
      - /app/.next

volumes:
  kuara-pgdata:
  kuara-minio-data:


networks:
  kuara-net:
