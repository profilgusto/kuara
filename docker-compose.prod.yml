# Production Docker Compose — Kuara Platform
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Prerequisites:
#   1. Traefik must be running: docker compose -f docker-compose.traefik.yml up -d
#   2. .env.prod filled in (copy from .env.prod.example)
#
# Required env vars: POSTGRES_PASSWORD, PAYLOAD_SECRET, NEXT_PUBLIC_SERVER_URL,
#                    MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, TRAEFIK_DOMAIN

services:

  # ── MinIO object storage ──────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - kuara-minio-data:/data
    networks:
      - kuara-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── MinIO bucket initialisation (runs once, then exits) ───────────────────────
  createbuckets:
    image: minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - kuara-net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing minio/kuara-media &&
        mc anonymous set download minio/kuara-media &&
        echo 'Bucket kuara-media ready.'
    restart: "no"

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - kuara-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: kuara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kuara
    networks:
      - kuara-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuara -d kuara"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Database migrations ───────────────────────────────────────────────────────
  # Runs `npx payload migrate`, applies all pending migrations, then exits.
  # Web will not start unless this service exits with code 0.
  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kuara:${POSTGRES_PASSWORD}@postgres:5432/kuara
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: kuara-media
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - kuara-net
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Next.js + Payload CMS ────────────────────────────────────────────────────
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: runner
    restart: always
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kuara:${POSTGRES_PASSWORD}@postgres:5432/kuara
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: kuara-media
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    networks:
      - kuara-net
      - traefik-net    # joins the shared Traefik network for routing
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3g
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    labels:
      # ── Tell Traefik to route this container ──────────────────────────────
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"

      # ── Main app router (HTTPS) ───────────────────────────────────────────
      - "traefik.http.routers.kuara.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.kuara.entrypoints=websecure"
      - "traefik.http.routers.kuara.tls=true"
      - "traefik.http.routers.kuara.tls.certresolver=letsencrypt"
      - "traefik.http.services.kuara.loadbalancer.server.port=3000"
      # Health check so Traefik only routes to a healthy container
      - "traefik.http.services.kuara.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.kuara.loadbalancer.healthcheck.interval=30s"

      # ── Security headers middleware ────────────────────────────────────────
      - "traefik.http.middlewares.kuara-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.kuara-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.kuara-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.kuara-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.kuara-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.kuara-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.kuara-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.kuara-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
      - "traefik.http.middlewares.kuara-headers.headers.customResponseHeaders.X-Permitted-Cross-Domain-Policies=none"
      - "traefik.http.middlewares.kuara-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self'; worker-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
      - "traefik.http.routers.kuara.middlewares=kuara-headers"

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  kuara-pgdata:
    driver: local
  kuara-minio-data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  kuara-net:
    driver: bridge
  traefik-net:
    external: true   # created and managed by docker-compose.traefik.yml
    name: traefik-net
