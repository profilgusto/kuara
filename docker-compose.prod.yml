# Production Docker Compose — Kuara Platform
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Assumes cloudflared tunnel terminates TLS and connects to Nginx on 127.0.0.1:80.
# Do NOT expose port 80 to 0.0.0.0 on the host — Nginx is internal-only.

services:

  # ── MinIO object storage ──────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - kuara-minio-data:/data
    networks:
      - kuara-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── MinIO bucket initialisation (runs once, then exits) ───────────────────────
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - kuara-internal
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing minio/kuara-media;
      mc anonymous set download minio/kuara-media;
      echo 'Bucket kuara-media ready.';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: "no"

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - kuara-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: kuara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kuara
    networks:
      - kuara-internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kuara -d kuara" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Database migrations ───────────────────────────────────────────────────────
  # Runs `npx payload migrate`, applies all pending migrations, then exits.
  # Web will not start unless this service exits with code 0.
  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kuara:${POSTGRES_PASSWORD}@postgres:5432/kuara
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: kuara-media
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - kuara-internal
    restart: "no"

  # ── Next.js + Payload CMS ────────────────────────────────────────────────────
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: runner # Uses the production-optimised multi-stage stage
    restart: always
    env_file:
      - .env.prod # All secrets live here — never commit this file
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kuara:${POSTGRES_PASSWORD}@postgres:5432/kuara
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: kuara-media
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    networks:
      - kuara-internal
    deploy:
      resources:
        limits:
          memory: 3g
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  # Bound ONLY to 127.0.0.1 — cloudflared connects here, internet cannot.
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - kuara-internal
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  kuara-pgdata:
    driver: local
  kuara-minio-data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  kuara-internal:
    driver: bridge
    internal: false # web needs outbound for Payload telemetry / npm (build only)
