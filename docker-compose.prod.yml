# Production Docker Compose — Kuara Platform
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Prerequisites:
#   1. Traefik must be running: docker compose -f docker-compose.traefik.yml up -d
#   2. .env.prod filled in (copy from .env.prod.example)
#
# Required env vars: POSTGRES_PASSWORD, PAYLOAD_SECRET, NEXT_PUBLIC_SERVER_URL,
#                    GARAGE_RPC_SECRET, S3_ACCESS_KEY, S3_SECRET_KEY, TRAEFIK_DOMAIN

services:

  # ── Garage object storage ─────────────────────────────────────────────────────
  # --single-node configures the one-node layout; --default-bucket creates the
  # access key and bucket from the GARAGE_DEFAULT_* variables on first boot.
  garage:
    image: dxflrs/garage:v2.4.1
    restart: always
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: kuara-media
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - kuara-garage-meta:/var/lib/garage/meta
      - kuara-garage-data:/var/lib/garage/data
    networks:
      kuara-net:
        aliases:
          # The web endpoint (3902) picks the bucket from the Host header, so
          # the bucket name must resolve to this container. See garage.toml.
          - kuara-media
    healthcheck:
      # The image is built from scratch: no shell, no curl — only /garage.
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Public-read switch (runs once, then exits) ────────────────────────────────
  # Enables anonymous GET on the web endpoint — the one step --default-bucket
  # does not cover. Shares garage's network namespace and volumes so the CLI
  # reaches the daemon exactly as `docker exec` would.
  garage-init:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "bucket", "website", "--allow", "kuara-media"]
    depends_on:
      garage:
        condition: service_healthy
    network_mode: "service:garage"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - kuara-garage-meta:/var/lib/garage/meta
      - kuara-garage-data:/var/lib/garage/data
    restart: on-failure:5

  # ── rclone (on demand: docker compose run --rm rclone …) ──────────────────────
  # The one tool for copying media in and out of the bucket; used by
  # scripts/backup-prod-full.sh, refresh-local-from-prod.sh and the
  # MinIO → Garage migration.
  rclone:
    image: rclone/rclone:1
    profiles: ["tools"]
    environment:
      RCLONE_CONFIG_GARAGE_TYPE: s3
      RCLONE_CONFIG_GARAGE_PROVIDER: Other
      RCLONE_CONFIG_GARAGE_ENDPOINT: http://garage:3900
      RCLONE_CONFIG_GARAGE_REGION: garage
      RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      # LEGACY — remove together with the minio service below.
      RCLONE_CONFIG_MINIO_TYPE: s3
      RCLONE_CONFIG_MINIO_PROVIDER: Minio
      RCLONE_CONFIG_MINIO_ENDPOINT: http://minio:9000
      RCLONE_CONFIG_MINIO_REGION: us-east-1
      RCLONE_CONFIG_MINIO_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
    networks:
      - kuara-net

  # ── LEGACY: MinIO (pre-Garage storage) ────────────────────────────────────────
  # Kept only so the already-running container stays addressable during the
  # migration (scripts/migrate-minio-to-garage.sh) and as the rollback target.
  # The profile keeps every normal `up` from touching it. The image is no longer
  # published — the copy cached on the server is the only one, so never prune
  # it while this block exists. Delete the block, the MINIO remote above and
  # the kuara-minio-data volume once the migration is signed off.
  minio:
    image: minio/minio:latest
    profiles: ["legacy-minio"]
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - kuara-minio-data:/data
    networks:
      - kuara-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - kuara-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: kuara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kuara
    networks:
      - kuara-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuara -d kuara"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Database migrations ───────────────────────────────────────────────────────
  # Runs `npx payload migrate`, applies all pending migrations, then exits.
  # Web will not start unless this service exits with code 0.
  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kuara:${POSTGRES_PASSWORD}@postgres:5432/kuara
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: kuara-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    networks:
      - kuara-net
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Next.js + Payload CMS ────────────────────────────────────────────────────
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_BASE_PATH: /kuara
    restart: always
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kuara:${POSTGRES_PASSWORD}@postgres:5432/kuara
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      NEXT_PUBLIC_BASE_PATH: /kuara
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: kuara-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    networks:
      - kuara-net
      - traefik-net    # joins the shared Traefik network for routing
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/kuara/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3g
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    labels:
      # ── Tell Traefik to route this container ──────────────────────────────
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"

      # ── Main app router (HTTPS) ───────────────────────────────────────────
      - "traefik.http.routers.kuara.rule=Host(`${TRAEFIK_DOMAIN}`) && PathPrefix(`/kuara`)"
      - "traefik.http.routers.kuara.entrypoints=websecure"
      - "traefik.http.routers.kuara.tls=true"
      - "traefik.http.routers.kuara.tls.certresolver=letsencrypt"
      - "traefik.http.services.kuara.loadbalancer.server.port=3000"
      # Health check so Traefik only routes to a healthy container
      - "traefik.http.services.kuara.loadbalancer.healthcheck.path=/kuara/api/health"
      - "traefik.http.services.kuara.loadbalancer.healthcheck.interval=30s"

      # ── Media router — /media/* stays unprefixed (existing DB-stored URLs
      # predate the /kuara move; see next.config.mjs's basePath:false rewrite) ─
      - "traefik.http.routers.kuara-media.rule=Host(`${TRAEFIK_DOMAIN}`) && PathPrefix(`/media`)"
      - "traefik.http.routers.kuara-media.entrypoints=websecure"
      - "traefik.http.routers.kuara-media.tls=true"
      - "traefik.http.routers.kuara-media.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kuara-media.service=kuara"

      # ── Root redirect: bare `/` → `/kuara` ────────────────────────────────
      - "traefik.http.middlewares.kuara-root-redirect.redirectregex.regex=^(https?://[^/]+)/$$"
      - "traefik.http.middlewares.kuara-root-redirect.redirectregex.replacement=$${1}/kuara"
      - "traefik.http.middlewares.kuara-root-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.kuara-root.rule=Host(`${TRAEFIK_DOMAIN}`) && Path(`/`)"
      - "traefik.http.routers.kuara-root.entrypoints=websecure"
      - "traefik.http.routers.kuara-root.tls=true"
      - "traefik.http.routers.kuara-root.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kuara-root.middlewares=kuara-root-redirect"
      - "traefik.http.routers.kuara-root.service=kuara"

      # ── Security headers middleware ────────────────────────────────────────
      - "traefik.http.middlewares.kuara-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.kuara-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.kuara-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.kuara-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.kuara-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.kuara-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.kuara-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.kuara-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
      - "traefik.http.middlewares.kuara-headers.headers.customResponseHeaders.X-Permitted-Cross-Domain-Policies=none"
      - "traefik.http.middlewares.kuara-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https: blob:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net; worker-src blob:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"
      - "traefik.http.routers.kuara.middlewares=kuara-headers"

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  kuara-pgdata:
    driver: local
  kuara-garage-meta:
    driver: local
  kuara-garage-data:
    driver: local
  kuara-minio-data:   # LEGACY — see the minio service
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  kuara-net:
    driver: bridge
  traefik-net:
    external: true   # created and managed by docker-compose.traefik.yml
    name: traefik-net
